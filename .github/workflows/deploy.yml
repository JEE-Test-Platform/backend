name: kdegrd
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: monkci-ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azuuure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.AR_PASSWORD }}

      - name: Buld and push Docker image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/jeetest-backend:${{ github.sha }} \
                       -t ${{ secrets.ACR_NAME }}.azurecr.io/jeetest-backend:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/jeetest-backend:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/jeetest-backend:latest

      - name: Azuure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/jeetest-backend:${{ github.sha }}
